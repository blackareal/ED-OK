<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกคะแนน · ค่าย STEM หนองหัวคู</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f; color: #e2e8f0; font-family: 'Segoe UI', 'Sarabun', sans-serif;
    padding: 16px 14px 40px; max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 1.15rem; font-weight: 800; text-align: center; margin-bottom: 2px; }
  .sub { text-align: center; color: #64748b; font-size: 0.78rem; margin-bottom: 18px; }
  .card {
    background: #111119; border: 1px solid #22222e; border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 0.9rem; color: #94a3b8; margin-bottom: 10px; letter-spacing: .5px; }
  select {
    width: 100%; padding: 12px 10px; border-radius: 10px; border: 1px solid #2a2a3a;
    background: #04040a; color: #e2e8f0; font-size: 0.95rem; margin-bottom: 4px;
  }
  .grade-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .grade-btn {
    flex: 1; min-width: 70px; padding: 10px 6px; border-radius: 10px; border: 2px solid #2a2a3a;
    background: #14141d; color: #cbd5e1; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  .grade-btn.selected { border-color: #38bdf8; background: rgba(56,189,248,.12); color: #38bdf8; }
  .grade-note { font-size: 0.75rem; color: #64748b; margin-top: 8px; }

  .team-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid #1c1c28;
  }
  .team-row:last-child { border-bottom: none; }
  .team-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
  .team-name { font-weight: 700; font-size: 0.88rem; width: 92px; flex-shrink: 0; }
  .rank-btns { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  .rank-btn {
    flex: 1; min-width: 58px; padding: 8px 4px; border-radius: 8px; border: 2px solid #2a2a3a;
    background: #14141d; color: #94a3b8; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    line-height: 1.4;
  }
  .rank-btn.selected { border-color: #22c55e; background: rgba(34,197,94,.14); color: #22c55e; }

  .status-box {
    text-align: center; padding: 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600;
    margin-top: 4px; background: rgba(255,255,255,.04); color: #94a3b8;
  }
  .status-box.ready { background: rgba(34,197,94,.1); color: #22c55e; }
  .status-box.done { background: rgba(56,189,248,.1); color: #38bdf8; }

  .btn-confirm {
    width: 100%; padding: 14px; border-radius: 12px; border: none; margin-top: 12px;
    background: #22c55e; color: #04140a; font-weight: 800; font-size: 1rem; cursor: pointer;
  }
  .btn-confirm:disabled { opacity: .35; cursor: not-allowed; }

  .hist { max-height: 220px; overflow-y: auto; }
  .hist-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 4px; border-bottom: 1px solid #1c1c28; font-size: 0.78rem;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-left { color: #94a3b8; }
  .hist-right { font-weight: 700; }
  .hist-empty { text-align: center; color: #475569; font-size: 0.8rem; padding: 14px 0; }

  .warn { background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.3);
    border-radius: 10px; padding: 10px; font-size: 0.78rem; text-align: center; margin-bottom: 14px; display: none; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #16a34a; color: #fff; padding: 11px 18px; border-radius: 10px;
    font-weight: 700; font-size: 0.85rem; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<h1>🏆 บันทึกคะแนนฐานกิจกรรม</h1>
<div class="sub">ค่าย STEM หนองหัวคูปวงประชานุเคราะห์ · 31 ส.ค. 2569</div>

<div class="warn" id="configWarning">⚠️ ยังไม่ได้ตั้งค่า SCRIPT_URL — แจ้งครู/สต๊าฟก่อนใช้งาน</div>

<div class="card">
  <h2>1. เลือกกิจกรรม</h2>
  <select id="select-activity" onchange="onActivityChange()"></select>
  <div class="grade-row" id="grade-row" style="display:none;"></div>
  <div class="grade-note" id="grade-note"></div>
</div>

<div class="card" id="team-card" style="display:none;">
  <h2>2. ให้อันดับแต่ละสี (กดซ้ำได้ถ้าอันดับร่วม)</h2>
  <div id="team-rows"></div>
  <div class="status-box" id="award-status">เลือกอันดับให้ครบทั้ง 4 สี</div>
  <button class="btn-confirm" id="btn-confirm" onclick="confirmScore()" disabled>✅ บันทึกคะแนน</button>
</div>

<div class="card">
  <h2>📋 ประวัติล่าสุด</h2>
  <div class="hist" id="hist"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsgHY5Ik5_rNMK_DQUhdFON1QdPAwzDK294B5PBnQn_tJSXcTXemn9JlKNdDNvnU7T/exec';

const TEAMS = [
  { id: 'เหลือง', name: 'สีเหลือง', emoji: '🟡', hex: '#eab308' },
  { id: 'ชมพู',   name: 'สีชมพู',   emoji: '🩷', hex: '#ec4899' },
  { id: 'ฟ้า',    name: 'สีฟ้า',    emoji: '🔵', hex: '#0ea5e9' },
  { id: 'เขียว',  name: 'สีเขียว',  emoji: '🟢', hex: '#22c55e' },
];

const GRADES = [
  { id: 'ม.1', name: 'ม.1' },
  { id: 'ม.2', name: 'ม.2' },
  { id: 'ม.3', name: 'ม.3' },
  { id: 'ม.ปลาย', name: 'ม.ปลาย' },
];

// scope:'grade' = ต้องเลือกระดับชั้นก่อน (แข่งแยกในระดับตัวเอง) · scope:'all' = กิจกรรมรวมทุกระดับ
const ACTIVITIES = [
  { id: 'base1', name: 'ฐาน 1 · Mystery Box ต่อหลอด', scope: 'grade' },
  { id: 'base2', name: 'ฐาน 2 · ต่อแก้ว', scope: 'grade' },
  { id: 'base3', name: 'ฐาน 3 · Blokus Strategy', scope: 'grade' },
  { id: 'base4', name: 'ฐาน 4 · คอนโดแม่ไก่', scope: 'grade' },
  { id: 'sky', name: 'SKY TARGET (บ่าย รวมทุกระดับ)', scope: 'all' },
];

const RANK_POINTS = { 1: 4, 2: 3, 3: 2, 4: 1 };
const RANK_LABELS = { 1: '🥇 ที่ 1', 2: '🥈 ที่ 2', 3: '🥉 ที่ 3', 4: '4️⃣ ที่ 4' };

let selection = {};      // { [colorId]: rank }
let selectedGrade = null;
let scoreRows = [];       // cache จาก getScores

function currentActivity() {
  const id = document.getElementById('select-activity').value;
  return ACTIVITIES.find(a => a.id === id) || null;
}

function populateActivitySelect() {
  const sel = document.getElementById('select-activity');
  sel.innerHTML = '<option value="">-- กรุณาเลือกกิจกรรม --</option>' +
    ACTIVITIES.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
}

function onActivityChange() {
  const act = currentActivity();
  selection = {};
  selectedGrade = act && act.scope === 'all' ? 'ทุกระดับ' : null;
  const gradeRow = document.getElementById('grade-row');
  const gradeNote = document.getElementById('grade-note');
  const teamCard = document.getElementById('team-card');

  if (!act) { gradeRow.style.display = 'none'; teamCard.style.display = 'none'; gradeNote.textContent = ''; return; }

  if (act.scope === 'grade') {
    gradeRow.style.display = 'flex';
    gradeRow.innerHTML = GRADES.map(g => `<button class="grade-btn" onclick="selectGrade('${g.id}')">${g.name}</button>`).join('');
    gradeNote.textContent = 'เลือกระดับชั้นที่กำลังแข่งที่ฐานนี้';
    teamCard.style.display = 'none';
  } else {
    gradeRow.style.display = 'none';
    gradeNote.textContent = 'กิจกรรมนี้แข่งรวมทุกระดับชั้นพร้อมกัน';
    teamCard.style.display = 'block';
    renderTeamRows();
  }
}

function selectGrade(gradeId) {
  selectedGrade = gradeId;
  selection = {};
  document.querySelectorAll('.grade-btn').forEach(b => b.classList.toggle('selected', b.textContent === gradeId));
  document.getElementById('team-card').style.display = 'block';
  renderTeamRows();
}

function renderTeamRows() {
  const wrap = document.getElementById('team-rows');
  wrap.innerHTML = TEAMS.map(t => `
    <div class="team-row">
      <div class="team-dot" style="background:${t.hex}"></div>
      <div class="team-name">${t.emoji} ${t.name}</div>
      <div class="rank-btns">
        ${[1,2,3,4].map(r => `<button class="rank-btn${selection[t.id]===r?' selected':''}" onclick="setRank('${t.id}',${r})">${RANK_LABELS[r]}<br>+${RANK_POINTS[r]}</button>`).join('')}
      </div>
    </div>`).join('');
  updateAwardStatus();
}

function setRank(colorId, rank) {
  selection[colorId] = rank;
  renderTeamRows();
}

function updateAwardStatus() {
  const el = document.getElementById('award-status');
  const btn = document.getElementById('btn-confirm');
  const complete = TEAMS.every(t => selection[t.id]);
  const act = currentActivity();
  const alreadyDone = act && selectedGrade && scoreRows.some(r => r.activityId === act.id && r.grade === selectedGrade);
  if (complete) {
    el.className = 'status-box ready';
    el.textContent = alreadyDone ? '✅ พร้อมบันทึก (เคยบันทึกกิจกรรมนี้ไปแล้ว บันทึกซ้ำได้ถ้าต้องการแก้ไข)' : '✅ พร้อมบันทึก';
  } else {
    el.className = 'status-box' + (alreadyDone ? ' done' : '');
    el.textContent = alreadyDone
      ? '✅ กิจกรรมนี้บันทึกไปแล้ว (เลือกอันดับให้ครบถ้าต้องการแก้ไข)'
      : 'เลือกอันดับให้ครบทั้ง 4 สี (กดซ้ำได้ถ้าอันดับร่วม)';
  }
  btn.disabled = !complete;
}

async function confirmScore() {
  const act = currentActivity();
  if (!act || !selectedGrade) return;
  const complete = TEAMS.every(t => selection[t.id]);
  if (!complete) return;
  if (!SCRIPT_URL || SCRIPT_URL.includes('PASTE_YOUR')) { alert('ยังไม่ได้ตั้งค่า SCRIPT_URL'); return; }
  if (!confirm(`ยืนยันบันทึกคะแนน "${act.name}" ${selectedGrade !== 'ทุกระดับ' ? '(' + selectedGrade + ')' : ''} ?`)) return;

  const btn = document.getElementById('btn-confirm');
  btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';

  const records = TEAMS.map(t => ({
    id: Date.now() + '-' + t.id,
    grade: selectedGrade,
    activityId: act.id,
    activityName: act.name,
    color: t.id,
    rank: selection[t.id],
    points: RANK_POINTS[selection[t.id]],
  }));

  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ records }) });
    const data = await res.json();
    if (data.status === 'ok') {
      showToast(`✅ บันทึก "${act.name}" เรียบร้อย!`);
      selection = {};
      await refreshScores();
      renderTeamRows();
    } else {
      alert('เกิดข้อผิดพลาด: ' + (data.message || 'ไม่ทราบสาเหตุ'));
    }
  } catch (err) {
    alert('ส่งข้อมูลไม่สำเร็จ: ' + err.message);
  } finally {
    btn.textContent = '✅ บันทึกคะแนน';
    updateAwardStatus();
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function renderHistory() {
  const el = document.getElementById('hist');
  if (!scoreRows.length) { el.innerHTML = '<div class="hist-empty">ยังไม่มีการบันทึกคะแนน</div>'; return; }
  const sorted = [...scoreRows].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 40);
  el.innerHTML = sorted.map(r => {
    const team = TEAMS.find(t => t.id === r.color);
    return `<div class="hist-item">
      <span class="hist-left">${r.activityName || r.activityId} ${r.grade && r.grade !== 'ทุกระดับ' ? '· ' + r.grade : ''}</span>
      <span class="hist-right" style="color:${team ? team.hex : '#fff'}">${team ? team.emoji : ''} ${r.color} +${r.points}</span>
    </div>`;
  }).join('');
}

async function refreshScores() {
  if (!SCRIPT_URL || SCRIPT_URL.includes('PASTE_YOUR')) return;
  try {
    const url = new URL(SCRIPT_URL);
    url.searchParams.set('action', 'getScores');
    const res = await fetch(url.toString(), { cache: 'no-store' });
    const data = await res.json();
    const headers = data.headers || [];
    const rows = data.rows || [];
    const idx = {};
    headers.forEach((h, i) => idx[h] = i);
    scoreRows = rows.map(r => ({
      id: r[idx.id], timestamp: r[idx.timestamp], grade: r[idx.grade],
      activityId: r[idx.activityId], activityName: r[idx.activityName],
      color: r[idx.color], rank: r[idx.rank], points: Number(r[idx.points]) || 0,
    }));
    renderHistory();
  } catch (err) {
    console.error('refreshScores failed', err);
  }
}

function init() {
  populateActivitySelect();
  if (!SCRIPT_URL || SCRIPT_URL.includes('PASTE_YOUR')) {
    document.getElementById('configWarning').style.display = 'block';
  }
  refreshScores();
  setInterval(refreshScores, 30000);
}
init();
</script>
</body>
</html>
